name: Auto Sync Fork

on:
  # 定时触发：每天 0 点执行一次（可根据需要修改 cron 表达式）
  schedule:
    - cron: '0 0 * * *'
  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run sync upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: 'gfwlist/gfwlist'  # 例如：torvalds/linux
          upstream_sync_branch: 'master'            # 上游分支，通常是 main 或 master
          target_sync_branch: 'master'            # 你仓库的分支
          test_mode: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

